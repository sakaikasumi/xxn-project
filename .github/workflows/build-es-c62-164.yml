name: Build ES c62.164 artifacts

on:
  push:
    branches:
      - artifact-es-c62-164
    paths:
      - tools/build-es-c62-164.mjs
      - .github/workflows/build-es-c62-164.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out artifact branch
        uses: actions/checkout@v4
        with:
          ref: artifact-es-c62-164
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build standalone HTML and TXT
        env:
          SOURCE_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-aa8c-81f5-9095-7fa5e3407251/raw?se=2026-09-21T13%3A23%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=c0f44d1e-357a-584a-adb9-7bb6a872ad9a&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T14%3A57%3A53Z&ske=2026-09-21T14%3A57%3A53Z&sks=b&skv=2026-02-06&sig=rj81bbJO4HBXvTfVkXHFve3/aS5kJPAvViK95lIiy0I%3D"
        run: node tools/build-es-c62-164.mjs

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ES_c62.164_BloomRoute_SourcePulse.html artifacts/ES_c62.164_BloomRoute_SourcePulse.txt artifacts/ES_c62.164_Checks.json
          if git diff --cached --quiet; then
            echo "Artifacts already up to date"
            exit 0
          fi
          git commit -m "Build ES c62.164 standalone artifacts"
          git push origin HEAD:artifact-es-c62-164
