name: YSL bounded resource discovery
on:
  push:
    branches: [ysl-resource-bridge]
    paths: ['tools/**', '.github/workflows/ysl-probe.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile tools/discover.py
      - name: Probe public official download sources
        run: python3 tools/discover.py
      - name: Save evidence and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YSL-source-discovery-v0.1
          path: |
            out/
            tools/
            README.md
          retention-days: 14
