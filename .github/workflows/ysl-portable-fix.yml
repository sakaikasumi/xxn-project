name: YSL portable repair and verified package
on:
  push:
    branches: [ysl-resource-bridge]
    paths: ['.github/workflows/ysl-portable-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      fixed_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ysl-resource-bridge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed fixes to source
        shell: python
        run: |
          from pathlib import Path
          p=Path('bridge.py'); s=p.read_text(encoding='utf-8')
          old='    def connect(self): return sqlite3.connect(self.dbpath,timeout=20)'
          new='    @contextmanager\n    def connect(self):\n        db = sqlite3.connect(self.dbpath, timeout=20)\n        try:\n            with db:\n                yield db\n        finally:\n            db.close()'
          assert s.count(old)==1, 'Source precondition mismatch'
          s=s.replace(old,new).replace('from __future__ import annotations','from __future__ import annotations\nfrom contextlib import contextmanager',1)
          old="urls=[ROOT,urljoin(ROOT,'mobile.html'),urljoin(ROOT,'d/index.html')]"
          assert old in s
          s=s.replace(old,"urls=[ROOT,urljoin(ROOT,'mobile.html'),urljoin(ROOT,'d/js/index.js')]")
          # Prefer IPv4 on networks that advertise unusable IPv6, retaining IP validation.
          old="ips=list(dict.fromkeys(x[4][0] for x in socket.getaddrinfo(p.hostname,443,type=socket.SOCK_STREAM)))"
          assert old in s
          s=s.replace(old,"ips=sorted(set(x[4][0] for x in socket.getaddrinfo(p.hostname,443,type=socket.SOCK_STREAM)), key=lambda x: (':' in x, x))")
          p.write_text(s,encoding='utf-8')
          p=Path('client.html'); s=p.read_text(encoding='utf-8')
          old="document.querySelectorAll('button').forEach(b=>b.disabled=false);"
          assert s.count(old)==1
          s=s.replace(old,"document.querySelectorAll('button').forEach(b=>b.disabled=b.dataset.locked==='true');")
          old='btn.disabled=item.directory||item.bytes>8388608;btn.onclick='
          assert old in s
          s=s.replace(old,"btn.disabled=item.directory||item.bytes>8388608;btn.dataset.locked=String(btn.disabled);btn.onclick=")
          p.write_text(s,encoding='utf-8')
          p=Path('live_probe.py'); s=p.read_text(encoding='utf-8')
          s=s.replace("url='https://mystyle.archosaur.com/d/index.html'","url='https://mystyle.archosaur.com/d/js/index.js'")
          s=s.replace("links=extract_links(text,url);", "print('MOBILE_DOWNLOAD_JS',text[:16000],flush=True); links=extract_links(text,url);")
          p.write_text(s,encoding='utf-8')
      - name: Unit and HTTP regression tests
        run: |
          mkdir -p out
          set -o pipefail
          python -m unittest tests -v 2>&1 | tee out/test-results.txt
          python build_helper.py
          node --check out/client-check.js
      - name: Actual current download-script inspection
        run: python live_probe.py
      - name: Record source fix on isolated branch only
        id: commit
        run: |
          test "$(git branch --show-current)" = "ysl-resource-bridge"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge.py client.html live_probe.py
          git commit -m "Close SQLite connections and retain UI disabled state; follow mobile download script"
          git push origin HEAD:ysl-resource-bridge
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Browser verification
        run: |
          python bridge.py --no-browser --cache /tmp/ysl-fixed-cache >out/server-console.txt 2>&1 &
          npm install --no-save agent-browser
          npx agent-browser install
          npx agent-browser open http://127.0.0.1:18763/
          npx agent-browser wait --load networkidle
          npx agent-browser get text body >out/browser-smoke.txt
          grep '本地中转已连接' out/browser-smoke.txt
          npx agent-browser snapshot -i >out/browser-snapshot.txt
          npx agent-browser click 'button[data-tab="cache"]'
          npx agent-browser get text '#cache' >>out/browser-smoke.txt
          npx agent-browser screenshot out/client-ui.png
          npx agent-browser close
          python build_helper.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YSL-v0.1-fixed-source-client
          path: |
            dist/
            out/
          retention-days: 30
  windows:
    needs: repair
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.fixed_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Windows source regression
        run: python -m unittest tests -v
      - uses: actions/download-artifact@v4
        with:
          name: YSL-v0.1-fixed-source-client
          path: linux-results
      - name: Build self-contained executable
        run: |
          python -m pip install pyinstaller==6.16.0
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item linux-results/out/*.json out/
          Copy-Item linux-results/out/*.txt out/
          python build_helper.py
          python -m PyInstaller --clean --noconfirm --onefile --noconsole --name YSL_v0.1 --add-data "client.html:." --add-data "evidence.json:." bridge.py
      - name: Smoke-test actual Windows executable
        run: python build_helper.py --smoke-exe
      - uses: actions/upload-artifact@v4
        with:
          name: YSL-v0.1-Windows-portable
          path: dist/
          retention-days: 30
