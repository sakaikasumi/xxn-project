name: ES168 original flare inspection
on:
  push:
    branches: [artifact-es-c62-168]
    paths: [tools/inspect-flare-168.py, tools/flare-detail-168.py, .github/workflows/inspect-flare-168.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifact-es-c62-168
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install UnityPy==1.25.3
      - run: python tools/flare-detail-168.py
      - name: Save evidence without changing main or viewer
        if: always()
        run: |
          git config user.name 'ES artifact builder'
          git config user.email 'es-artifact-builder@users.noreply.github.com'
          if test -d artifacts/flare168; then
            git add artifacts/flare168
            git commit -m 'Record compact original flare settings' || true
            git push origin HEAD:artifact-es-c62-168
          fi
