name: ES168 original flare inspection
on:
  push:
    branches: [artifact-es-c62-168]
    paths: [tools/export-mv322-lens168.py, .github/workflows/inspect-flare-168.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifact-es-c62-168
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install UnityPy==1.25.3
      - run: python tools/export-mv322-lens168.py
      - name: Save source sprite and evidence on artifact branch
        run: |
          git config user.name 'ES artifact builder'
          git config user.email 'es-artifact-builder@users.noreply.github.com'
          git add artifacts/flare168/mv322-pack.json artifacts/flare168/EffectAtlas_mv322_Lens.png artifacts/flare168/sprite-evidence.json artifacts/flare168/sprite-preview.txt
          git commit -m 'Extract authored MV322 lens pixels with provenance'
          git push origin HEAD:artifact-es-c62-168
