name: ES c62.169 softer native flare
on:
  push:
    branches: [artifact-es-c62-169]
    paths:
      - tools/native-pulse-169.js
      - tools/build-es-c62-169.mjs
      - tools/test-es-c62-169.mjs
      - .github/workflows/build-es-c62-169.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: artifact-es-c62-169
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --no-package-lock acorn@8.15.0 playwright@1.55.0
      - name: Build appearance-only c62.169
        run: node tools/build-es-c62-169.mjs
      - name: Verify generated HTML and locked controller
        run: |
          test -s artifacts/ES_c62.169_SoftNativeFlare.html
          node -e "const c=require('./artifacts/ES_c62.169_Checks.json'); if(c.controllerLock!=='renderCallYourNameSourcePulse164 byte-identical to c62.168') process.exit(1); console.log(c)"
      - name: Commit generated HTML on artifact branch
        run: |
          git config user.name 'ES artifact builder'
          git config user.email 'es-artifact-builder@users.noreply.github.com'
          git add artifacts/ES_c62.169_SoftNativeFlare.html artifacts/ES_c62.169_Checks.json
          git commit -m 'Build c62.169 softer native flare' || true
          git push origin HEAD:artifact-es-c62-169
      - uses: actions/upload-artifact@v4
        with:
          name: ES_c62.169_SoftNativeFlare
          path: artifacts/ES_c62.169_SoftNativeFlare.html
          compression-level: 6
          retention-days: 14
          if-no-files-found: error
